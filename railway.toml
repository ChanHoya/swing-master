# Railway 배포 설정.
#
# nixpacks 대신 backend/Dockerfile 을 쓴다. nixpacks 는 Python 버전과
# 시스템 라이브러리를 추론하는데, 이 백엔드는 OpenCV·MediaPipe 용
# libgl1·libglib2.0-0·libgomp1 과 한글 폰트(fonts-nanum)가 필요하고
# requirements.txt 가 Python 3.13 에 고정돼 있어 추론에 맡기기 어렵다.

[build]
builder = "dockerfile"
dockerfilePath = "backend/Dockerfile"

[deploy]
healthcheckPath = "/health"
healthcheckTimeout = 60
restartPolicyType = "on_failure"
restartPolicyMaxRetries = 3
